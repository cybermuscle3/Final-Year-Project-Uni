y<!DOCTYPE html>
<html>
<head>
    <title>Smart NFC Control Panel</title>
</head>
<body>
    <h1>🚪 Smart NFC Control Panel</h1>
    <form method="post" action="/dump">
        <button>Dump NFC Card 🟢</button>
    </form>
    <form method="post" action="/write">
        <button>Write to Card 🔄</button>
    </form>
    <form method="post" action="/clone">
        <button>Clone NFC Card 🧬</button>
    </form>
    <h3>Register User:</h3>
    <form method="post" action="/register">
        <input type="text" name="name" placeholder="Name">
        <input type="email" name="email" placeholder="Email">
        <button>Register 📝</button>
    </form>
    <h3>Scan Logs:</h3>
    <table border="1">
        <tr><th>UID</th><th>Time</th><th>Result</th><th>Method</th></tr>
        {% for log in logs %}
        <tr>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
            <td>{{ log[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
